name: Deploy to AWS

# Same shape as inventory-dashboard: build a static bundle, sync it to S3,
# invalidate CloudFront. `main` → Production, `staging` → staging.
#
# Required per GitHub Environment (Production / staging):
#   vars:    NEXT_PUBLIC_FIELDPULSE_API_URL, NEXT_PUBLIC_ERP_API_URL,
#            NEXT_PUBLIC_CHATWOOT_ORIGIN
#   secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#            S3_BUCKET, CLOUDFRONT_ID
# See deploy/README.md for the AWS side (bucket, distribution, headers)..

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'staging' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Next 16 requires Node >= 20.9; the inventory pipeline's Node 18 will not build this.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: npm ci
        run: npm ci --prefer-offline --no-audit

      - name: Build static export
        # `next build` with `output: "export"` writes the site to ./out.
        # lib/config.ts throws on a missing NEXT_PUBLIC_* variable, so an
        # unconfigured environment fails here rather than shipping a bundle
        # that points at the wrong API.
        run: npm run build
        env:
          NEXT_PUBLIC_FIELDPULSE_API_URL: ${{ vars.NEXT_PUBLIC_FIELDPULSE_API_URL }}
          NEXT_PUBLIC_ERP_API_URL: ${{ vars.NEXT_PUBLIC_ERP_API_URL }}
          NEXT_PUBLIC_CHATWOOT_ORIGIN: ${{ vars.NEXT_PUBLIC_CHATWOOT_ORIGIN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Order matters: hashed assets first, HTML last, so a page that goes live
      # never references a chunk that is not in the bucket yet.
      - name: Sync hashed assets (immutable)
        run: |
          aws s3 sync ./out/_next/static "s3://${{ secrets.S3_BUCKET }}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync pages and public files (revalidate)
        # Old chunks under _next/static are kept so tabs already open keep
        # working through a deploy; everything else that vanished is deleted.
        run: |
          aws s3 sync ./out "s3://${{ secrets.S3_BUCKET }}" --delete \
            --exclude "_next/static/*" --exclude "sw.js" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Upload service worker (never cached)
        # A cached sw.js pins users to an old app shell; Next's dev headers
        # do the same thing locally (see next.config.ts).
        run: |
          aws s3 cp ./out/sw.js "s3://${{ secrets.S3_BUCKET }}/sw.js" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
